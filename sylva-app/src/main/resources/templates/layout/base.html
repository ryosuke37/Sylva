<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>layout</title>
</head>
<body>

<div th:fragment="layout" th:remove="tag" >
    <meta charset="UTF-8">
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <link th:href="@{/css/base/style.css}" rel="styleSheet">
    <link th:href="@{/css/components/form.css}" rel="styleSheet">
    <link th:href="@{/css/components/post.css}" rel="styleSheet">
    <link th:href="@{/css/components/post-modal.css}" rel="styleSheet">
    <link th:href="@{/css/components/side-bar.css}" rel="styleSheet">
    <!--  icon_namesはアルファベット順で並べること  -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close,comment,format_quote,new_window" rel="stylesheet"/>
    <script defer src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script defer th:src="@{/js/post-modal.js}"></script>
</div>

</body>
</html>
